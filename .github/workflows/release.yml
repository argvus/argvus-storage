name: Arch package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Build and publish Arch package
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            cargo \
            git \
            gnupg \
            gtk3 \
            gtk-layer-shell \
            libnotify \
            pacman-contrib \
            pkgconf \
            rust \
            sudo \
            udisks2 \
            xdg-utils

      - name: Prepare build user
        run: |
          useradd --create-home --shell /bin/bash builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' >/etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Prepare PKGBUILD version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*([._+-][A-Za-z0-9]+)*$ ]]; then
            echo "Unsupported version tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          cargo_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [[ "$cargo_version" != "$version" ]]; then
            echo "Cargo.toml version (${cargo_version}) does not match tag (${version})." >&2
            exit 1
          fi

          sed -i "s/^pkgver=.*/pkgver=${version}/" packaging/PKGBUILD
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Run clippy
        run: |
          sudo -u builder env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash -lc \
            'cd "$GITHUB_WORKSPACE" && cargo clippy --locked --all-targets --all-features -- -D warnings'

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail

          sudo -u builder env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash -lc \
            'cd "$GITHUB_WORKSPACE/packaging" && makepkg --syncdeps --noconfirm --needed --cleanbuild --clean'

          pkg_file="$(find packaging -maxdepth 1 -type f -name 'argvus-storage-*.pkg.tar.zst' -print -quit)"
          if [[ -z "$pkg_file" ]]; then
            echo "Package file was not created." >&2
            exit 1
          fi

          {
            echo "pkg_file=${pkg_file}"
            echo "pkg_name=$(basename "$pkg_file")"
            echo "pkg_sig_file=${pkg_file}.sig"
          } >> "$GITHUB_ENV"

      - name: Sign package
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          [ -n "${GPG_PRIVATE_KEY:-}" ] || { echo "::error::GPG_PRIVATE_KEY secret is not set"; exit 1; }

          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"

          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')"
          [ -n "$GPG_KEY_ID" ] || { echo "::error::No secret GPG key was imported"; exit 1; }

          rm -f "${pkg_file}.sig"
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --local-user "$GPG_KEY_ID" --detach-sign "$pkg_file"
          else
            gpg --batch --yes --pinentry-mode loopback \
              --local-user "$GPG_KEY_ID" --detach-sign "$pkg_file"
          fi

      - name: Upload temporary package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.pkg_name }}
          path: |
            ${{ env.pkg_file }}
            ${{ env.pkg_sig_file }}
          if-no-files-found: error
          retention-days: 1

      - name: Checkout packages repository
        uses: actions/checkout@v4
        with:
          repository: argvus/packages
          path: packages-repo
          token: ${{ secrets.PACKAGES_REPO_TOKEN }}

      - name: Publish package to argvus/packages
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          [ -n "${GPG_PRIVATE_KEY:-}" ] || { echo "::error::GPG_PRIVATE_KEY secret is not set"; exit 1; }

          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')"
          [ -n "$GPG_KEY_ID" ] || { echo "::error::No secret GPG key was imported"; exit 1; }

          gpg_sign() {
            local target="$1"
            rm -f "${target}.sig"
            if [ -n "${GPG_PASSPHRASE:-}" ]; then
              gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --local-user "$GPG_KEY_ID" --detach-sign "$target"
            else
              gpg --batch --yes --pinentry-mode loopback \
                --local-user "$GPG_KEY_ID" --detach-sign "$target"
            fi
          }

          repo_dir="$GITHUB_WORKSPACE/packages-repo/public/arch/x86_64"
          mkdir -p "$repo_dir"
          cp "$GITHUB_WORKSPACE/${pkg_file}" "$repo_dir/${pkg_name}"
          cp "$GITHUB_WORKSPACE/${pkg_sig_file}" "$repo_dir/${pkg_name}.sig"

          cd "$repo_dir"
          repo-add -R argvus.db.tar.gz "$pkg_name"
          gpg_sign argvus.db.tar.gz
          gpg_sign argvus.files.tar.gz
          gpg_sign argvus.db
          gpg_sign argvus.files

          cd "$GITHUB_WORKSPACE/packages-repo"
          git config --global --add safe.directory "$PWD"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/arch/x86_64

          if git diff --cached --quiet -- public/arch/x86_64; then
            echo "No package repository changes to publish."
            exit 0
          fi

          git commit -m "Publish argvus-storage ${{ steps.version.outputs.version }}"
          git push
